common:
  environment:
    name: interview-airfoil
    entrypoint: pipeline.exp_layer.aero2d.interview:invoke
    version: OpenFOAM-v2512 (2512); build _87ed40d256-20251219; label32 scalar64;
      gmsh=4.15.2; numpy=2.5.3
  task:
    name: target-lift-2d-airfoil
    prompt: 'This is a required-coverage smoke experiment for an ordinary two-dimensional
      airfoil. Approach Cl=0.15 under the frozen physical model; maximize J=-abs(Cl-0.15).
      Use observed evidence for decisions. Every M0 fixed stage needs at least one
      new feedback-derived design evaluated. At an M1 stage, first independently evaluate
      every initialized design under M1; if a formally confirmed design already meets
      |Cl-0.15|<=0.01, an evidence-citing stop is legitimate. Otherwise continue using
      the new M1 evidence. All decisions must stay within the remaining budget.

      Read experiment.level, experiment.arm and candidate.representation to select
      your allowed action. Fixed arms use evaluate_design only (or stop); omit requested_numerics
      and requested_conditions entirely for any formal action. The host already supplies
      the correct formal condition and settings. Only Level2-b may use explore with
      requested_numerics.mesh_scale in [0.7,1.3], or submit_for_evaluation with NO
      requested numerical/condition fields.

      PARAMETERIZED TASK (Levels 0 and 1): change alpha_deg only. In M0, evaluate
      at least one new feedback-derived design before stopping at |Cl-0.15|<0.01.
      In M1, use the independently re-evaluated evidence and the M1 stopping rule
      above.

      EXPLICIT-SHAPE TASK (Levels 2 and 3): demonstrating an actual shape change is
      REQUIRED, in addition to approaching target lift. Your FIRST new proposed design
      must modify several upper/lower ordinates with a small smooth shape change,
      for example a modest camber variation of your choice. Changing alpha alone or
      reprinting the initial point arrays DOES NOT satisfy this task, even if the
      lift target is met. Preserve every x station exactly, close both endpoints,
      retain legal thickness, and return complete literal arrays. You may change alpha
      together with the shape. Cite the evidence informing both choices. Do not stop
      merely because an unchanged shape reaches the lift target: an actual changed
      shape must first be evaluated in this stage. An actually changed shape inherited
      from M0 must be evaluated anew in M1. That independent M1 evaluation can satisfy
      the M1 stopping rule if the target is met; otherwise propose further shape/design
      improvements.

      LEVEL2-b additionally must demonstrate autonomous experimentation: start by
      choosing a question, a genuinely modified explicit shape, and an authorized
      non-default mesh_scale for explore. Use the resulting raw evidence to decide
      subsequent experiments and which design to submit_for_evaluation. Exploration
      never has a formal score. You choose the actual candidate, mesh scale, question,
      number of experiments and stopping decision; the host will not automatically
      confirm a design. After sufficient exploration, submit a worthwhile shape for
      the independent frozen evaluation. A successful smoke covers explore -> feedback-dependent
      decision -> formal submission. A budget-forced unconfirmed stop remains honest
      but does not demonstrate that success path.

      Keep shape changes modest and smooth for this short laminar smoke. Each tested
      candidate costs one solver call plus four tools; preserve formal-confirmation
      budget. Stop honestly on exhausted budget or unsupported evidence. This single
      replicate tests runnable coverage and is not a statistical comparison of algorithm
      performance.'
    params:
      alpha_deg:
        type: float
        bounds:
        - -5.0
        - 10.0
        default: 2.0
    options: {}
    geometry: *id001
    objective:
      field: Cl
      direction: target
      target: 0.15
    constraints: []
    trust:
      required: *id002
    evaluation:
      tool: post
      required_conditions:
      - design
      allowed_sources:
      - live
      ranking_tolerance: 1.0e-12
      improvement_tolerance: 0.01
  tools:
    geometry:
      requires: []
      produces:
      - geometry
    mesh:
      requires:
      - geometry
      produces:
      - mesh
    solve:
      requires:
      - mesh
      produces:
      - solution
    post:
      requires:
      - solution
      produces:
      - post
  workflow:
    mode: fixed
    fixed:
    - geometry
    - mesh
    - solve
    - post
  limits:
    max_candidates: 6
    total_tools: 24
    solve_slots: 6
    total_llm: 6
    wall_clock_s: 600
    validation_reserve: 4
    retries: 0
    tool_timeout_s: 30
    llm_timeout_s: 180
  llm_model: claude-cli:claude-sonnet-5
  seed: 0
